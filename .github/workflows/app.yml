# Builds the browser app and puts it on the branch dist/app, which GitHub
# Pages serves (Settings > Pages > Deploy from a branch > dist/app, / (root)).
name: app

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: app
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - name: Test the Go code
        run: go vet ./... && go test ./...
      - name: Build the app
        working-directory: web
        run: |
          bun install --frozen-lockfile
          bun run test
          bun run build
      - name: Publish to the branch dist/app
        working-directory: web
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bun run branch
          git push --force origin dist/app
